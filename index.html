<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Chat</title>

    <style>
        /* =========================
           BASE
        ========================= */

        @font-face {
            font-family: "Yandex Sans";
            src: local("Yandex Sans"),
                 local("YandexSans");
            font-weight: 100 900;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            font-family: "Yandex Sans", Arial, sans-serif;
            background: #ffffff;
            color: #111111;
            overflow: hidden;
        }

        button,
        input,
        textarea {
            font-family: inherit;
        }

        button {
            border: 0;
            cursor: pointer;
        }

        /* =========================
           APP
        ========================= */

        .app {
            display: flex;
            width: 100%;
            height: 100vh;
            min-height: 600px;
        }

        /* =========================
           LEFT SIDEBAR
        ========================= */

        .sidebar {
            width: 310px;
            min-width: 310px;
            height: 100%;
            padding: 20px 16px;

            display: flex;
            flex-direction: column;

            background: #f7f7f7;
            border-right: 1px solid #ededed;
        }

        .sidebar-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .brand {
            font-size: 21px;
            font-weight: 700;
            letter-spacing: -0.4px;
        }

        .new-chat {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 14px;
            background: #ffffff;
            color: #111111;

            font-size: 24px;
            transition:
                background 0.15s ease,
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }

        .new-chat:hover {
            background: #eeeeee;
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
        }

        /* =========================
           SEARCH
        ========================= */

        .search {
            position: relative;
            margin-bottom: 18px;
        }

        .search input {
            width: 100%;
            height: 44px;

            padding: 0 15px 0 42px;

            border: 1px solid #e7e7e7;
            border-radius: 14px;

            outline: none;
            background: #ffffff;

            font-size: 14px;
            color: #111111;

            transition:
                border-color 0.15s ease,
                box-shadow 0.15s ease;
        }

        .search input:focus {
            border-color: #d0d0d0;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.035);
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);

            color: #888;
            font-size: 17px;
            pointer-events: none;
        }

        /* =========================
           CHAT LIST
        ========================= */

        .history-title {
            padding: 0 10px 8px;

            color: #888;
            font-size: 12px;
            font-weight: 600;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding-right: 2px;
        }

        .chat-item {
            width: 100%;
            min-height: 48px;

            display: flex;
            align-items: center;

            padding: 0 12px;
            margin-bottom: 3px;

            border-radius: 13px;

            background: transparent;
            color: #333;

            text-align: left;
            font-size: 14px;

            transition: background 0.15s ease;
        }

        .chat-item:hover {
            background: #ededed;
        }

        .chat-item.active {
            background: #e9e9e9;
            color: #111;
            font-weight: 600;
        }

        .chat-item-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* =========================
           SIDEBAR BOTTOM
        ========================= */

        .sidebar-bottom {
            padding-top: 12px;
            border-top: 1px solid #e9e9e9;
        }

        .sidebar-button {
            width: 100%;
            height: 45px;

            display: flex;
            align-items: center;
            gap: 11px;

            padding: 0 12px;

            border-radius: 13px;

            background: transparent;
            color: #444;

            font-size: 14px;
            text-align: left;

            transition: background 0.15s ease;
        }

        .sidebar-button:hover {
            background: #ededed;
        }

        /* =========================
           MAIN
        ========================= */

        .main {
            flex: 1;
            min-width: 0;
            height: 100%;

            display: flex;
            flex-direction: column;

            background: #ffffff;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            height: 72px;
            min-height: 72px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 34px;

            border-bottom: 1px solid #f0f0f0;
        }

        .model-selector {
            position: relative;
        }

        .model-button {
            height: 42px;

            display: flex;
            align-items: center;
            gap: 9px;

            padding: 0 14px;

            border-radius: 13px;

            background: #f5f5f5;
            color: #111;

            font-size: 14px;
            font-weight: 600;

            transition:
                background 0.15s ease,
                box-shadow 0.15s ease;
        }

        .model-button:hover {
            background: #ededed;
        }

        .model-arrow {
            font-size: 12px;
            color: #777;
            transition: transform 0.15s ease;
        }

        .model-selector.open .model-arrow {
            transform: rotate(180deg);
        }

        /* =========================
           MODEL MENU
        ========================= */

        .model-menu {
            position: absolute;
            top: 49px;
            left: 0;

            width: 270px;

            padding: 7px;

            background: #ffffff;
            border: 1px solid #e9e9e9;
            border-radius: 16px;

            box-shadow:
                0 12px 40px rgba(0, 0, 0, 0.10),
                0 2px 8px rgba(0, 0, 0, 0.04);

            opacity: 0;
            visibility: hidden;
            transform: translateY(-5px);

            transition:
                opacity 0.15s ease,
                transform 0.15s ease,
                visibility 0.15s ease;

            z-index: 20;
        }

        .model-selector.open .model-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .model-option {
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 11px 12px;

            border-radius: 11px;

            background: transparent;
            text-align: left;

            transition: background 0.12s ease;
        }

        .model-option:hover {
            background: #f4f4f4;
        }

        .model-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .model-name {
            font-size: 14px;
            font-weight: 600;
        }

        .model-description {
            font-size: 11px;
            color: #888;
        }

        .model-check {
            opacity: 0;
            font-size: 16px;
        }

        .model-option.selected .model-check {
            opacity: 1;
        }

        /* =========================
           USER
        ========================= */

        .user-button {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #eeeeee;
            color: #555;

            font-size: 14px;
            font-weight: 700;

            transition: background 0.15s ease;
        }

        .user-button:hover {
            background: #e3e3e3;
        }

        /* =========================
           CHAT AREA
        ========================= */

        .chat-area {
            flex: 1;
            min-height: 0;

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }

        .messages {
            flex: 1;
            min-height: 0;

            width: 100%;
            max-width: 1050px;

            margin: 0 auto;

            padding: 35px 35px 20px;

            overflow-y: auto;
        }

        /* =========================
           WELCOME
        ========================= */

        .welcome {
            min-height: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding-bottom: 70px;

            text-align: center;
        }

        .welcome-title {
            margin: 0 0 10px;

            font-size: 32px;
            line-height: 1.15;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .welcome-subtitle {
            margin: 0;

            color: #888;

            font-size: 15px;
        }

        /* =========================
           MESSAGE
        ========================= */

        .message {
            display: flex;
            margin-bottom: 28px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 78%;

            padding: 13px 16px;

            border-radius: 17px;

            font-size: 15px;
            line-height: 1.55;
        }

        .message.user .message-content {
            background: #f0f0f0;
        }

        .message.assistant .message-content {
            background: transparent;
        }

        /* =========================
           INPUT AREA
        ========================= */

        .composer-wrapper {
            width: 100%;
            max-width: 1050px;

            margin: 0 auto;

            padding: 12px 35px 28px;
        }

        .composer {
            position: relative;

            display: flex;
            align-items: flex-end;

            min-height: 68px;

            padding: 10px 12px 10px 17px;

            border: 1px solid #dedede;
            border-radius: 23px;

            background: #ffffff;

            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.035);

            transition:
                border-color 0.15s ease,
                box-shadow 0.15s ease;
        }

        .composer:focus-within {
            border-color: #cfcfcf;

            box-shadow:
                0 5px 24px rgba(0, 0, 0, 0.06);
        }

        .attach-button {
            width: 44px;
            height: 44px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 14px;

            background: transparent;
            color: #666;

            font-size: 23px;

            transition:
                background 0.15s ease,
                color 0.15s ease;
        }

        .attach-button:hover {
            background: #f1f1f1;
            color: #111;
        }

        .message-input {
            flex: 1;

            min-height: 44px;
            max-height: 180px;

            padding: 11px 12px;

            border: 0;
            outline: none;

            resize: none;

            background: transparent;

            color: #111;

            font-size: 15px;
            line-height: 1.45;
        }

        .message-input::placeholder {
            color: #999;
        }

        .send-button {
            width: 44px;
            height: 44px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 14px;

            background: #111111;
            color: #ffffff;

            font-size: 19px;

            transition:
                transform 0.15s ease,
                opacity 0.15s ease,
                background 0.15s ease;
        }

        .send-button:hover {
            transform: translateY(-1px);
            background: #222222;
        }

        .send-button:disabled {
            opacity: 0.35;
            cursor: default;
            transform: none;
        }

        .composer-hint {
            margin-top: 9px;

            text-align: center;

            color: #aaa;
            font-size: 11px;
        }

        /* =========================
           MOBILE
        ========================= */

        .mobile-menu-button {
            display: none;
        }

        @media (max-width: 900px) {
            .sidebar {
                width: 270px;
                min-width: 270px;
            }

            .header {
                padding: 0 22px;
            }

            .messages {
                padding-left: 22px;
                padding-right: 22px;
            }

            .composer-wrapper {
                padding-left: 22px;
                padding-right: 22px;
            }
        }

        @media (max-width: 700px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;

                width: 290px;
                min-width: 290px;

                z-index: 100;

                transform: translateX(-100%);

                transition: transform 0.2s ease;

                box-shadow: 10px 0 35px rgba(0, 0, 0, 0.08);
            }

            .sidebar.mobile-open {
                transform: translateX(0);
            }

            .mobile-menu-button {
                display: flex;

                width: 40px;
                height: 40px;

                align-items: center;
                justify-content: center;

                margin-right: 8px;

                border-radius: 12px;

                background: #f3f3f3;
                font-size: 20px;
            }

            .header {
                height: 64px;
                min-height: 64px;

                padding: 0 14px;
            }

            .header-left {
                display: flex;
                align-items: center;
            }

            .model-button {
                max-width: 190px;
            }

            .model-button span:first-child {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .messages {
                padding: 22px 14px 15px;
            }

            .welcome {
                padding-bottom: 30px;
            }

            .welcome-title {
                font-size: 27px;
            }

            .welcome-subtitle {
                font-size: 14px;
            }

            .message-content {
                max-width: 88%;
            }

            .composer-wrapper {
                padding: 8px 10px 15px;
            }

            .composer {
                min-height: 62px;
                border-radius: 20px;
            }

            .composer-hint {
                display: none;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside class="sidebar" id="sidebar">

        <div class="sidebar-top">
            <div class="brand">AI Chat</div>

            <button class="new-chat" id="newChatButton" title="Новый чат">
                +
            </button>
        </div>

        <div class="search">
            <span class="search-icon">⌕</span>
            <input
                type="text"
                id="searchInput"
                placeholder="Поиск чатов..."
            >
        </div>

        <div class="history-title">
            История
        </div>

        <div class="chat-list" id="chatList">

            <button class="chat-item active">
                <span class="chat-item-title">
                    Новый разговор
                </span>
            </button>

            <button class="chat-item">
                <span class="chat-item-title">
                    Помощь с программированием
                </span>
            </button>

            <button class="chat-item">
                <span class="chat-item-title">
                    Подготовка к экзамену
                </span>
            </button>

            <button class="chat-item">
                <span class="chat-item-title">
                    Обсуждение проекта
                </span>
            </button>

        </div>

        <div class="sidebar-bottom">

            <button class="sidebar-button">
                ⚙
                <span>Настройки</span>
            </button>

        </div>

    </aside>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="main">

        <!-- HEADER -->

        <header class="header">

            <div class="header-left">

                <button
                    class="mobile-menu-button"
                    id="mobileMenuButton"
                    aria-label="Меню"
                >
                    ☰
                </button>

                <div class="model-selector" id="modelSelector">

                    <button
                        class="model-button"
                        id="modelButton"
                    >
                        <span id="selectedModel">
                            Claude Sonnet 5
                        </span>

                        <span class="model-arrow">
                            ▼
                        </span>
                    </button>

                    <div class="model-menu">

                        <button
                            class="model-option selected"
                            data-model="Claude Sonnet 5"
                        >
                            <span class="model-info">
                                <span class="model-name">
                                    Claude Sonnet 5
                                </span>

                                <span class="model-description">
                                    Быстрый и универсальный
                                </span>
                            </span>

                            <span class="model-check">
                                ✓
                            </span>
                        </button>


                        <button
                            class="model-option"
                            data-model="Claude Opus 5"
                        >
                            <span class="model-info">
                                <span class="model-name">
                                    Claude Opus 5
                                </span>

                                <span class="model-description">
                                    Максимальная сложность задач
                                </span>
                            </span>

                            <span class="model-check">
                                ✓
                            </span>
                        </button>


                        <button
                            class="model-option"
                            data-model="Claude Fable 5"
                        >
                            <span class="model-info">
                                <span class="model-name">
                                    Claude Fable 5
                                </span>

                                <span class="model-description">
                                    Для больших задач
                                </span>
                            </span>

                            <span class="model-check">
                                ✓
                            </span>
                        </button>

                    </div>

                </div>

            </div>


            <button class="user-button">
                Т
            </button>

        </header>


        <!-- CHAT -->

        <section class="chat-area">

            <div class="messages" id="messages">

                <div class="welcome" id="welcome">

                    <h1 class="welcome-title">
                        Чем могу помочь?
                    </h1>

                    <p class="welcome-subtitle">
                        Задай вопрос или начни новый разговор
                    </p>

                </div>

            </div>


            <!-- COMPOSER -->

            <div class="composer-wrapper">

                <div class="composer">

                    <button
                        class="attach-button"
                        id="attachButton"
                        title="Прикрепить файл"
                    >
                        +
                    </button>

                    <textarea
                        class="message-input"
                        id="messageInput"
                        rows="1"
                        placeholder="Напишите сообщение..."
                    ></textarea>

                    <button
                        class="send-button"
                        id="sendButton"
                        disabled
                        title="Отправить"
                    >
                        ↑
                    </button>

                </div>

                <div class="composer-hint">
                    AI может допускать ошибки. Проверяйте важную информацию.
                </div>

            </div>

        </section>

    </main>

</div>


<script>
    /* =========================
       ELEMENTS
    ========================= */

    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const messages = document.getElementById("messages");
    const welcome = document.getElementById("welcome");

    const modelSelector = document.getElementById("modelSelector");
    const modelButton = document.getElementById("modelButton");
    const selectedModel = document.getElementById("selectedModel");

    const mobileMenuButton =
        document.getElementById("mobileMenuButton");

    const sidebar =
        document.getElementById("sidebar");

    const newChatButton =
        document.getElementById("newChatButton");


    /* =========================
       MODEL MENU
    ========================= */

    modelButton.addEventListener("click", function (event) {
        event.stopPropagation();

        modelSelector.classList.toggle("open");
    });


    document.querySelectorAll(".model-option").forEach(option => {

        option.addEventListener("click", function () {

            const model =
                this.dataset.model;

            selectedModel.textContent = model;

            document
                .querySelectorAll(".model-option")
                .forEach(item => {
                    item.classList.remove("selected");
                });

            this.classList.add("selected");

            modelSelector.classList.remove("open");
        });

    });


    document.addEventListener("click", function (event) {

        if (!modelSelector.contains(event.target)) {
            modelSelector.classList.remove("open");
        }

    });


    /* =========================
       INPUT
    ========================= */

    function updateSendButton() {

        const hasText =
            messageInput.value.trim().length > 0;

        sendButton.disabled = !hasText;

    }


    messageInput.addEventListener("input", function () {

        updateSendButton();

        this.style.height = "auto";

        this.style.height =
            Math.min(this.scrollHeight, 180) + "px";

    });


    /* =========================
       SEND MESSAGE
    ========================= */

    function sendMessage() {

        const text =
            messageInput.value.trim();

        if (!text) {
            return;
        }

        if (welcome) {
            welcome.remove();
        }

        const userMessage =
            document.createElement("div");

        userMessage.className =
            "message user";

        userMessage.innerHTML = `
            <div class="message-content"></div>
        `;

        userMessage
            .querySelector(".message-content")
            .textContent = text;

        messages.appendChild(userMessage);

        messageInput.value = "";
        messageInput.style.height = "44px";

        updateSendButton();

        messages.scrollTop =
            messages.scrollHeight;

        /*
         * Позже здесь подключим API.
         */
    }


    sendButton.addEventListener(
        "click",
        sendMessage
    );


    messageInput.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {
                event.preventDefault();

                if (!sendButton.disabled) {
                    sendMessage();
                }
            }

        }
    );


    /* =========================
       NEW CHAT
    ========================= */

    newChatButton.addEventListener(
        "click",
        function () {

            messages.innerHTML = `
                <div class="welcome" id="welcome">

                    <h1 class="welcome-title">
                        Чем могу помочь?
                    </h1>

                    <p class="welcome-subtitle">
                        Задай вопрос или начни новый разговор
                    </p>

                </div>
            `;

            messageInput.value = "";

            messageInput.style.height = "44px";

            updateSendButton();

        }
    );


    /* =========================
       CHAT SELECTION
    ========================= */

    document
        .querySelectorAll(".chat-item")
        .forEach(item => {

            item.addEventListener(
                "click",
                function () {

                    document
                        .querySelectorAll(".chat-item")
                        .forEach(chat => {
                            chat.classList.remove("active");
                        });

                    this.classList.add("active");

                }
            );

        });


    /* =========================
       MOBILE MENU
    ========================= */

    mobileMenuButton.addEventListener(
        "click",
        function () {

            sidebar.classList.toggle(
                "mobile-open"
            );

        }
    );


    document.addEventListener(
        "click",
        function (event) {

            if (
                window.innerWidth <= 700 &&
                sidebar.classList.contains("mobile-open") &&
                !sidebar.contains(event.target) &&
                !mobileMenuButton.contains(event.target)
            ) {
                sidebar.classList.remove(
                    "mobile-open"
                );
            }

        }
    );


    /* =========================
       INITIAL STATE
    ========================= */

    updateSendButton();

</script>

</body>
</html>
