</div>

<script>

    /*
     * ==========================================
     * FRONTEND STATE
     * ==========================================
     *
     * Здесь специально НЕТ API-ключей.
     *
     * После создания backend:
     *
     * GET  /api/models
     * POST /api/chats
     * POST /api/chat/completions
     *
     * API keys будут храниться только
     * на сервере.
     */

    let models = [];

    let selectedModelId = null;


    const modelSelector =
        document.getElementById("modelSelector");

    const modelButton =
        document.getElementById("modelButton");

    const modelMenu =
        document.getElementById("modelMenu");

    const selectedModel =
        document.getElementById("selectedModel");

    const messageInput =
        document.getElementById("messageInput");

    const sendButton =
        document.getElementById("sendButton");

    const messages =
        document.getElementById("messages");

    const sidebar =
        document.getElementById("sidebar");


    /*
     * ==========================================
     * LOAD MODELS
     * ==========================================
     *
     * В будущем здесь будет:
     *
     * fetch("/api/models")
     *
     * Пока оставляем пустой список.
     */

    async function loadModels() {

        try {

            const response =
                await fetch("/api/models");

            if (!response.ok) {
                throw new Error("Models API unavailable");
            }

            models = await response.json();

            renderModels();

        } catch (error) {

            /*
             * Backend ещё не подключён.
             * Никаких выдуманных моделей сюда
             * специально не добавляем.
             */

            modelMenu.innerHTML = `
                <div style="
                    padding: 12px;
                    color: #77716a;
                    font-size: 12px;
                ">
                    Модели пока не настроены
                </div>
            `;

        }

    }


    /*
     * ==========================================
     * RENDER MODELS
     * ==========================================
     */

    function renderModels() {

        modelMenu.innerHTML = "";

        if (!models.length) {

            modelMenu.innerHTML = `
                <div style="
                    padding: 12px;
                    color: #77716a;
                    font-size: 12px;
                ">
                    Нет доступных моделей
                </div>
            `;

            return;
        }


        models.forEach(model => {

            const button =
                document.createElement("button");

            button.className =
                "model-option";

            button.dataset.id =
                model.id;


            button.innerHTML = `

                <span class="model-option-info">

                    <span class="model-option-name">
                        ${escapeHtml(model.name)}
                    </span>

                    <span class="model-option-description">
                        ${escapeHtml(model.description || "")}
                    </span>

                </span>

                <span class="model-check">
                    ✓
                </span>
            `;


            button.addEventListener(
                "click",
                () => selectModel(model.id)
            );


            modelMenu.appendChild(button);

        });

    }


    /*
     * ==========================================
     * SELECT MODEL
     * ==========================================
     */

    function selectModel(modelId) {

        const model =
            models.find(
                item => item.id === modelId
            );

        if (!model) {
            return;
        }

        selectedModelId =
            model.id;

        selectedModel.textContent =
            model.name;


        document
            .querySelectorAll(".model-option")
            .forEach(option => {

                option.classList.toggle(
                    "selected",
                    option.dataset.id === modelId
                );

            });


        modelSelector.classList.remove("open");

    }


    /*
     * ==========================================
     * MODEL MENU
     * ==========================================
     */

    modelButton.addEventListener(
        "click",
        event => {

            event.stopPropagation();

            modelSelector.classList.toggle("open");

        }
    );


    document.addEventListener(
        "click",
        event => {

            if (!modelSelector.contains(event.target)) {

                modelSelector.classList.remove("open");

            }

        }
    );


    /*
     * ==========================================
     * INPUT
     * ==========================================
     */

    function updateSendButton() {

        sendButton.disabled =
            !messageInput.value.trim();

    }


    messageInput.addEventListener(
        "input",
        function () {

            updateSendButton();

            this.style.height =
                "auto";

            this.style.height =
                Math.min(
                    this.scrollHeight,
                    180
                ) + "px";

        }
    );


    /*
     * ==========================================
     * SEND
     * ==========================================
     */

    async function sendMessage() {

        const text =
            messageInput.value.trim();

        if (!text) {
            return;
        }


        if (welcome) {
            welcome.remove();
        }


        addMessage(
            "user",
            text
        );


        messageInput.value = "";

        messageInput.style.height =
            "42px";

        updateSendButton();


        /*
         * В будущем:
         *
         * POST /api/chat/completions
         *
         * {
         *     model: selectedModelId,
         *     message: text
         * }
         *
         * Backend сам выберет:
         *
         * Base URL
         * API Key
         * Model ID
         */


        addMessage(
            "assistant",
            "API ещё не подключён. Сейчас мы тестируем интерфейс."
        );

    }


    sendButton.addEventListener(
        "click",
        sendMessage
    );


    messageInput.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                if (!sendButton.disabled) {
                    sendMessage();
                }

            }

        }
    );


    /*
     * ==========================================
     * ADD MESSAGE
     * ==========================================
     */

    function addMessage(
        role,
        text
    ) {

        const message =
            document.createElement("div");

        message.className =
            `message ${role}`;


        const content =
            document.createElement("div");

        content.className =
            "message-content";

        content.textContent =
            text;


        message.appendChild(content);

        messages.appendChild(message);


        messages.scrollTop =
            messages.scrollHeight;

    }


    /*
     * ==========================================
     * NEW CHAT
     * ==========================================
     */

    document
        .getElementById("newChatButton")
        .addEventListener(
            "click",
            newChat
        );


    function newChat() {

        messages.innerHTML = `

            <div
                class="welcome"
                id="welcome"
            >

                <h1 class="welcome-title">
                    Чем могу помочь?
                </h1>

                <p class="welcome-subtitle">
                    Задайте вопрос, загрузите файл или начните новый разговор
                </p>

            </div>
        `;

        messageInput.value = "";

        messageInput.style.height =
            "42px";

        updateSendButton();

    }


    /*
     * ==========================================
     * MOBILE
     * ==========================================
     */

    document
        .getElementById("mobileMenuButton")
        .addEventListener(
            "click",
            () => {

                sidebar.classList.toggle(
                    "mobile-open"
                );

            }
        );


    /*
     * ==========================================
     * HTML ESCAPE
     * ==========================================
     */

    function escapeHtml(value) {

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");

    }


    /*
     * ==========================================
     * START
     * ==========================================
     */

    loadModels();

</script>

</body>
</html>
